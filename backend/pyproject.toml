[project]
name = "picture-classification"
version = "0.1.0"
description = "FastAPI-Backend: Urlaubsfotos lokal per Ollama klassifizieren und als Fotobuch-PDF exportieren"
authors = [
    {name = "Jan Michel Pfeifer"}
]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi (>=0.162.4,<0.163.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)",
    "python-multipart (>=0.0.33,<0.0.34)",
    "pydantic-settings (>=2.16.2,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "sqlmodel (>=0.0.49,<0.0.50)",
    "pillow (>=13.0.0,<14.0.0)",
    "pillow-heif (>=1.8.1,<2.0.0)",
    "imagehash (>=4.3.2,<5.0.0)",
    "ollama (>=0.6.3,<0.7.0)",
    "reportlab (>=5.1.0,<6.0.0)"
]

[tool.poetry]
package-mode = false

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.2.0,<10.0.0)",
    "pytest-asyncio (>=1.4.1.post1,<2.0.0)",
    "ruff (>=0.17.4,<0.18.0)",
    "mypy (>=2.4.1,<3.0.0)",
    "types-reportlab (>=5.1.0.20261104,<6.0.0.0)"
]
